name: Validate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, lint, typecheck, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies with Aube
        uses: jdx/aube-action@v1
        with:
          run-install: true

      - name: Check formatting
        run: aube run format:check

      - name: Lint
        run: aube run lint

      - name: Typecheck
        run: aube run typecheck

      - name: Build
        run: aube run build
